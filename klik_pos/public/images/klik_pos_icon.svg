<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KLiK PoS">
  <defs>
    <!-- The green of the KLiK PoS PWA manifest (theme_color #2e7d32), lit from the top-left. -->
    <linearGradient id="klikPosTile" x1="24" y1="8" x2="488" y2="504" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4caf50"/>
      <stop offset="1" stop-color="#24702a"/>
    </linearGradient>
  </defs>

  <!-- app tile: square and full bleed, because the desk draws an app logo in a square box and
       stretches whatever it is given to fit it. A wide wordmark here is what turned the tile
       into a smear. -->
  <rect width="512" height="512" rx="116" fill="url(#klikPosTile)"/>

  <!-- the receipt, sitting above the register -->
  <rect x="176" y="64" width="160" height="158" rx="26" fill="#ffffff"/>
  <rect x="204" y="96" width="104" height="16" rx="8" fill="#2e7d32"/>
  <rect x="204" y="128" width="104" height="16" rx="8" fill="#2e7d32"/>
  <rect x="204" y="160" width="68" height="16" rx="8" fill="#2e7d32"/>

  <!-- the register the receipt is rung up on -->
  <rect x="88" y="248" width="336" height="200" rx="48" fill="#ffffff"/>
  <rect x="200" y="272" width="112" height="12" rx="6" fill="#2e7d32"/>
  <rect x="132" y="300" width="248" height="64" rx="18" fill="#2e7d32"/>
  <rect x="148" y="392" width="44" height="32" rx="12" fill="#2e7d32"/>
  <rect x="234" y="392" width="44" height="32" rx="12" fill="#2e7d32"/>
  <rect x="320" y="392" width="44" height="32" rx="12" fill="#2e7d32"/>
</svg>
